name: cmenstudio-prod
services:
  frontend:
    image: jerryzheng0907/angular-frontend:latest
    build: ./Frontend
    ports:
      - "4200:80"
    container_name: angular-frontend
    depends_on:
      - backend

  backend:
    image: jerryzheng0907/backend:latest
    build: ./Backend
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      API_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - redis

  db:
    image: postgres:16
    restart: always
    volumes:
      - ./database/postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"
    container_name: pg-prod

  redis:
    image: redis:7-alpine
    restart: always
    container_name: redis-prod

