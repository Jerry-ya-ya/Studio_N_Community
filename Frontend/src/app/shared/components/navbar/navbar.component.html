<nav class="sidebar" [class.sidebar--collapsed]="collapsed" [attr.aria-label]="'nav.aria.main' | translate">
  <header class="sidebar-header">
    <button
      class="sidebar-toggle"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="!collapsed"
      [attr.aria-label]="(collapsed ? 'nav.aria.expand' : 'nav.aria.collapse') | translate"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <a
      class="brand-wordmark"
      [routerLink]="[homeEntryPath]"
      [attr.aria-label]="'nav.aria.brandHome' | translate: { brand: brandName }"
    >
      <span class="brand-wordmark__text brand-wordmark__text--cmen">CMENStudio</span>
      <span class="brand-wordmark__text brand-wordmark__text--eden">EDEN</span>
    </a>
  </header>

  <div class="nav-sections">
    @for (section of sections; track section.key) {
      @if (isSectionVisible(section)) {
        <section class="nav-section" [class]="'nav-section nav-section--' + section.key">
          @for (item of section.items; track item.labelKey) {
            @if (item.action === 'logout') {
              <button
                class="nav-item nav-item--action logout"
                type="button"
                (click)="logout()"
                [attr.title]="item.labelKey | translate"
              >
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.labelKey | translate }}</span>
              </button>
            } @else {
              <a
                class="nav-item"
                [routerLink]="[item.route]"
                routerLinkActive="nav-item--active"
                [routerLinkActiveOptions]="{ exact: item.route === path.home }"
                [attr.title]="item.labelKey | translate"
              >
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.labelKey | translate }}</span>
              </a>
            }
          }
        </section>
      }
    }
  </div>
</nav>
