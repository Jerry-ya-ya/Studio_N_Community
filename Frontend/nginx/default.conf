server {
  listen 80;
  server_name _;

  # Gzip 壓縮已在 nginx.conf 中全域設定

  # Angular 靜態檔
  root /usr/share/nginx/html;
  index index.html;

  # Send SNI and validate Azure's certificate when BACKEND_UPSTREAM is HTTPS.
  # These directives are inert for Compose's HTTP upstream.
  proxy_ssl_server_name on;
  proxy_ssl_name $proxy_host;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  # 安全性標頭
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;

  # BACKEND_UPSTREAM is rendered by the official Nginx entrypoint. Compose
  # uses http://backend:5000; Azure uses the Backend Container App's internal
  # HTTPS FQDN.
  location /api/ {
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    # Container Apps routes the internal request by this host/SNI pair. Pass
    # the browser-visible host separately for Flask's trusted ProxyFix layer.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
  }

  location ^~ /static/uploads/ {
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    expires 1h;
    add_header Cache-Control "public";
  }

  # PWA 相關檔案
  location = /manifest.webmanifest {
    add_header Content-Type application/manifest+json;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /ngsw-worker.js {
    add_header Content-Type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 主要路由 - Angular 路由
  location / {
    try_files $uri $uri/ /index.html;
    
    # 靜態資源快取
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # 健康檢查端點
  location /healthz {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # 錯誤頁面配置
  include /etc/nginx/conf.d/error.conf;

  # 404 錯誤頁面
  location = /404.html {
      internal;
      root /usr/share/nginx/html;
  }

  # 50x 錯誤頁面
  location = /50x.html {
      internal;
      root /usr/share/nginx/html;
  }
}
